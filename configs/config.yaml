project:
  name: MTL-ALIGNN
  root: "D:/ck/MTL-ALIGNN"
  python: "D:/ck/anaconda_env/envs/two/python.exe"

paths:
  db_path: "D:/ck/MTL-ALIGNN/data/c2db.db"
  processed_dir: "D:/ck/MTL-ALIGNN/data/processed"
  graph_dir: "D:/ck/MTL-ALIGNN/data/processed/graphs"
  export_dir: "D:/ck/MTL-ALIGNN/data/processed/exports"
  results_dir: "D:/ck/MTL-ALIGNN/results/reproduced"

database:
  id_field: uid
  ehull_field: ehull
  dynamic_field: dyn_stab
  formula_field: formula
  spacegroup_symbol_field: international
  spacegroup_number_field: number
  layergroup_field: layergroup
  layergroup_number_field: lgnum
  bravais_field: bravais_type
  source_label_field: label
  thickness_field: thickness

labels:
  ehull_threshold_eV_per_atom: 0.10
  dynamic_positive: ["yes"]
  dynamic_negative: ["no"]
  dynamic_unknown: ["unknown"]

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  group_column: reduced_formula
  search_trials: 800

graph:
  neighbor_strategy: k-nearest
  cutoff: 8.0
  cutoff_extra: 3.5
  max_neighbors: 12
  atom_features: cgcnn
  use_canonize: true
  dtype: float32

model:
  alignn_layers: 4
  gcn_layers: 4
  embedding_features: 64
  hidden_features: 256
  dropout: 0.10
  cgcnn_layers: 3
  cgcnn_bond_bins: 41
  cgcnn_bond_max: 8.0

training:
  device: auto
  batch_size: 16
  minimum_batch_size: 4
  num_workers: 0
  max_epochs: 200
  patience: 30
  scheduler_patience: 10
  scheduler_factor: 0.5
  learning_rate: 0.001
  weight_decay: 0.00001
  gradient_clip_norm: 5.0
  class_weighting: none  # none is preferred for probability calibration; use balanced only if needed
  amp: false
  monitor: joint_pr_auc
  main_seeds: [2025, 2026, 2027]
  ensemble_seeds: [2025, 2026, 2027, 2028, 2029]
  ablation_seeds: [2025, 2026, 2027]

uncertainty:
  mc_samples: 30
  calibration_bins: 15
  epsilon: 1.0e-7
  candidate_scores:
    - predictive_std
    - predictive_entropy
    - mutual_information

ranking:
  lambdas: [0.0, 0.25, 0.5, 1.0, 2.0]
  validation_k: [10, 20, 50, 100]
  report_k: [10, 20, 50, 100]
  top_k_unknown: 100
  robust_quantiles: [0.05, 0.95]

outputs:
  export_cif_top_k: 100
  save_member_probabilities: true
  save_embeddings: false

runtime:
  skip_completed: true
  fail_on_graph_error: true
  torch_float32_matmul_precision: high
